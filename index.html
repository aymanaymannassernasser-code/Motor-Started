<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Offline Engineering Tool for Motor Starting Analysis">
    <meta name="theme-color" content="#0f172a">
    <title>MotorStart Pro v3.1</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
</head>
<body>
    <header class="no-print">
        <div class="header-content">
            <h1>MotorStart Pro <small>v3.1</small></h1>
            <div id="offlineIndicator" class="badge-online">● Online</div>
        </div>
    </header>

    <div class="print-header">
        <h2>Motor Starting Analysis Report</h2>
        <p id="printDate"></p>
    </div>

    <main class="dashboard">
        <aside class="sidebar no-print">
            <section class="card">
                <h3>1. System Configuration</h3>
                <div class="input-grid">
                    <div class="field"><label>Power (kW)</label><input type="number" id="mKW" value="110"></div>
                    <div class="field"><label>Voltage (V)</label><input type="number" id="mVolts" value="400"></div>
                    <div class="field"><label>FLC (A)</label><input type="number" id="mFLC" value="195"></div>
                    <div class="field"><label>RPM</label><input type="number" id="mRPM" value="1485"></div>
                    <div class="field"><label>Hot Stall (s)</label><input type="number" id="hStall" value="20"></div>
                </div>
                
                <h4 class="sub-header">Inertia (J) kgm²</h4>
                <div class="input-grid">
                    <div class="field"><label>Motor J</label><input type="number" id="motorJ" value="1.2"></div>
                    <div class="field"><label>Load J</label><input type="number" id="loadJ" value="8.5"></div>
                    <div class="field full-width disabled-look"><label>Total Inertia</label><div id="totalJ" class="fake-input">9.7</div></div>
                </div>
            </section>

            <section class="card">
                <h3>2. Starter Settings</h3>
                <div class="tabs">
                    <button class="tab-btn active" data-mode="DOL">DOL</button>
                    <button class="tab-btn" data-mode="SS">Soft Start</button>
                </div>
                
                <div id="ssPanel" class="hidden mt-10">
                    <div class="input-grid">
                        <div class="field"><label>Init Current %</label><input type="number" id="ssInitI" value="250"></div>
                        <div class="field"><label>Current Limit %</label><input type="number" id="ssLimit" value="350"></div>
                        <div class="field"><label>Ramp Time (s)</label><input type="number" id="ssRamp" value="5"></div>
                    </div>
                </div>

                <div class="action-buttons mt-15">
                    <button id="btnSimulate" class="btn-primary">▶ RUN SIMULATION</button>
                    <button id="btnPDF" class="btn-secondary">📄 SAVE REPORT</button>
                </div>
            </section>

            <section class="card collapsed-mobile">
                <h3>3. Curve Presets</h3>
                <div class="input-grid">
                    <div class="field"><label>Motor Type</label>
                        <select id="motorPreset">
                            <option value="oem">Standard IEC</option>
                            <option value="highSlip">High Slip (NEMA D)</option>
                        </select>
                    </div>
                    <div class="field"><label>Load Type</label>
                        <select id="loadPreset">
                            <option value="centrifugal">Pump/Fan (Quad)</option>
                            <option value="constant">Conveyor (Const)</option>
                        </select>
                    </div>
                </div>
                <div id="curveDataStore" style="display:none;"></div>
            </section>
        </aside>

        <article class="results-area">
            <div class="results-bar">
                <div class="res-item"><small>Start Time</small><b id="resTime">--</b></div>
                <div class="res-item"><small>Thermal Cap</small><b id="resTherm">--</b></div>
                <div class="res-item"><small>Min Torque</small><b id="resNet">--</b></div>
                <div class="res-item"><small>Min Start I</small><b id="resMinI">--</b></div>
            </div>

            <div class="chart-wrapper">
                <canvas id="mainChart"></canvas>
            </div>
            
            <div class="print-only-footer">
                <p>Generated by MotorStart Pro - Engineering Digital Twin</p>
            </div>
        </article>
    </main>

    <script src="app.js"></script>
    <script>
        // PWA Registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('SW Registered'))
                .catch(err => console.error('SW Fail', err));
        }
        window.addEventListener('offline', () => document.getElementById('offlineIndicator').className = 'badge-offline');
        window.addEventListener('online', () => document.getElementById('offlineIndicator').className = 'badge-online');
    </script>
</body>
</html>
